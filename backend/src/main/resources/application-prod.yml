spring:
  datasource:
    url: jdbc:mysql://localhost:3306/chuchensmart?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: chuchensmart
    password: root

  ai:
    openai:
      api-key: ${OPENAI_API_KEY} # 必须通过环境变量注入
      chat:
        options:
          model: gpt-4o
          temperature: 0.3 # 低随机性，保证回答稳定
      # 生产环境连接配置
      timeout: 5000
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 1000
          multiplier: 2.0
    vectorstore:
      pgvector:
        enabled: true
        jdbc-url: jdbc:postgresql://prod-db:5432/ai_prod
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        pool-size: 10

# 生产环境 OSS 配置
ps:
  alioss:
    endpoint: ${OSS_ENDPOINT}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME}

# 生产环境日志配置
logging:
  level:
    com.example.chuchensmart: info
    org.springframework.web: warn
  file:
    name: logs/chuchensmart.log
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
